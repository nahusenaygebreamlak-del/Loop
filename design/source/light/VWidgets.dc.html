<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Home screen widgets</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap">
<style>
:where(a.lk){display:inline-flex;align-items:center;justify-content:center;text-align:center;color:inherit;text-decoration:none;cursor:pointer}:where(a.lkb){display:block;color:inherit;text-decoration:none;cursor:pointer}a.lk.row,a.lk.item,a.lk.r,a.lk.b,a.lk.set,a.lk.note{justify-content:flex-start;text-align:left}a.lk.b{align-items:flex-start}
body{margin:0}
*{box-sizing:border-box}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
.ic{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.w{background:#FFFFFF;color:#141A2E;border-radius:28px}
.r{display:flex;align-items:center;gap:10px;min-height:44px;border-bottom:1px solid #F2F4F9}
.r:last-child{border-bottom:0}
.r .t{flex-grow:1;font-size:14.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.r .tm{font-size:12.5px;font-weight:600;color:#636B80;font-variant-numeric:tabular-nums}
.chk{flex:0 0 32px;width:32px;height:32px;display:flex;align-items:center;justify-content:center}
.chk i{display:flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:50%;border:2px solid #C9D2E3;color:#FFFFFF}
.chk.on i{background:#2F6BE3;border-color:#2F6BE3}
.mc{font-size:11.5px;font-weight:700;text-align:center;height:22px;display:flex;align-items:center;justify-content:center;font-variant-numeric:tabular-nums}
.mc.mut{color:#C9D2E3}
.mc.sel span{background:#2F6BE3;color:#FFFFFF;border-radius:7px;width:22px;height:20px;display:flex;align-items:center;justify-content:center}
.mc.has{color:#2F6BE3}
.app{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;font-weight:600;color:#FFFFFF}
.app span.i{width:56px;height:56px;border-radius:18px;background:rgba(255,255,255,0.22)}

@keyframes lpSheet{from{transform:translateY(100%)}to{transform:none}}@keyframes lpDim{from{background-color:#F2F4F9}}@keyframes lpPop{0%{opacity:0;transform:scale(.92)}60%{opacity:1;transform:scale(1.02)}100%{transform:none}}@keyframes lpUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}@keyframes lpDrop{from{opacity:0;transform:translateY(-28px) scale(.98)}to{opacity:1;transform:none}}@keyframes lpLeft{from{transform:translateX(-100%)}to{transform:none}}@keyframes lpFade{from{opacity:0}to{opacity:1}}@keyframes lpTick{0%{transform:scale(.4)}55%{transform:scale(1.18)}100%{transform:none}}@keyframes lpGrow{from{width:20%}}@keyframes lpPulse{0%,100%{box-shadow:0 0 0 0 rgba(199,55,47,.45)}50%{box-shadow:0 0 0 6px rgba(199,55,47,0)}}section[style*="border-radius: 28px 28px 0 0"]{animation:lpSheet .42s cubic-bezier(.2,.9,.25,1) both}div[style*="background: #8E95A6"]{animation:lpDim .3s ease-out both}section[role="alertdialog"]{animation:lpPop .32s cubic-bezier(.2,.9,.25,1) .05s both}nav[aria-label="Main menu"]{animation:lpLeft .38s cubic-bezier(.2,.9,.25,1) both}article[aria-label="Loop notification"]{animation:lpDrop .5s cubic-bezier(.2,.9,.25,1) .15s both}[role="status"]{animation:lpUp .36s cubic-bezier(.2,.9,.25,1) .25s both}h1{animation:lpUp .4s cubic-bezier(.2,.9,.25,1) both}.grp,.note,.ag,.empty{animation:lpUp .45s cubic-bezier(.2,.9,.25,1) .06s both}.grp+.grp,.lab+.grp{animation-delay:.1s}div[aria-hidden="true"][style*="border-radius: 50%; background: #2F6BE3"]{animation:lpTick .5s cubic-bezier(.2,.9,.25,1) .1s both}.chk.on i{animation:lpTick .4s cubic-bezier(.2,.9,.25,1) both}[role="progressbar"]>div{animation:lpGrow .6s cubic-bezier(.2,.9,.25,1) .1s both}[aria-label="Add task"],[aria-label="New note"]{animation:lpPop .4s cubic-bezier(.2,.9,.25,1) .18s both}[aria-label^="Now,"] span{animation:lpPulse 2s ease-in-out infinite}a.lk,a.lkb,button{transition:transform .14s ease,filter .14s ease,background-color .2s ease}a.lk:active,button:active{transform:scale(.96)}a.lkb:active{transform:scale(.985)}a.lk:hover,button:hover{filter:brightness(.97)}@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</helmet>
<div style="width: 390px; height: 844px; background: #34466E; font-family: 'Plus Jakarta Sans', ui-sans-serif, system-ui, sans-serif; display: flex; flex-direction: column; padding: 56px 20px 32px; gap: 16px; overflow: hidden;">

  <section aria-label="Today widget" class="w" style="padding: 18px 16px 10px 20px; display: flex; flex-direction: column;">
    <div style="display: flex; align-items: center; gap: 10px; margin-bottom: 6px;">
      <div style="flex-grow: 1;">
        <div style="font-size: 12.5px; font-weight: 600; color: #636B80;">Friday, Oct 16</div>
        <div style="font-size: 20px; font-weight: 800;">Today</div>
      </div>
      <span style="font-size: 12.5px; font-weight: 700; color: #2F6BE3; background: #DCE6FB; border-radius: 10px; padding: 6px 10px;">1 of 6 done</span>
      <a href="VQuickAdd.dc.html" class="lk" aria-label="Add task" style="width: 40px; height: 40px; border-radius: 14px; background: #2F6BE3; color: #FFFFFF; display: flex; align-items: center; justify-content: center;"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true" style="width: 20px; height: 20px; stroke-width: 2.4;"><path d="M12 5v14M5 12h14"/></svg></a>
    </div>
    <div class="r"><span class="tm" style="color: #2F6BE3;">10:00</span><span class="t">Review onboarding wireframes</span><a href="NDoneUndo.dc.html" class="lk chk" aria-label="Mark done"><i style="border-color: #C7372F;"></i></a></div>
    <div class="r"><span class="tm">11:00</span><span class="t">Team sync</span><a href="NDoneUndo.dc.html" class="lk chk" aria-label="Mark done"><i></i></a></div>
    <div class="r"><span class="tm">14:00</span><span class="t">Send invoice to client</span><a href="NDoneUndo.dc.html" class="lk chk" aria-label="Mark done"><i></i></a></div>
    <div class="r"><span class="tm">17:00</span><span class="t">Dentist</span><a href="NDoneUndo.dc.html" class="lk chk" aria-label="Mark done"><i></i></a></div>
    <div class="r"><span class="tm" style="visibility: hidden;">00:00</span><span class="t" style="color: #636B80; text-decoration: line-through;">Call bank about card</span><button class="chk on" aria-label="Mark not done"><i><svg viewBox="0 0 24 24" aria-hidden="true" style="width: 12px; height: 12px; fill: none; stroke: currentColor; stroke-width: 3.4; stroke-linecap: round; stroke-linejoin: round;"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></i></button></div>
  </section>

  <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px;">
    <section aria-label="Calendar widget" class="w" style="padding: 14px 12px 12px;">
      <div style="display: flex; align-items: baseline; justify-content: space-between; padding: 0 4px 6px;">
        <span style="font-size: 15px; font-weight: 800;">October</span>
        <span style="font-size: 11.5px; font-weight: 700; color: #636B80;">6 today</span>
      </div>
      <div style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); color: #636B80;">
        <div class="mc">S</div><div class="mc">M</div><div class="mc">T</div><div class="mc">W</div><div class="mc">T</div><div class="mc">F</div><div class="mc">S</div>
      </div>
      <div style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); row-gap: 1px;">
        <sc-for list="{{cells}}" as="c" hint-placeholder-count="35"><div class="{{c.cls}}"><span>{{c.d}}</span></div></sc-for>
      </div>
    </section>

    <section aria-label="Quick add widget" class="w" style="background: #2F6BE3; color: #FFFFFF; padding: 18px; display: flex; flex-direction: column; justify-content: space-between;">
      <div style="width: 52px; height: 52px; border-radius: 18px; background: #FFFFFF; color: #2F6BE3; display: flex; align-items: center; justify-content: center;"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true" style="width: 26px; height: 26px; stroke-width: 2.6;"><path d="M12 5v14M5 12h14"/></svg></div>
      <div>
        <div style="font-size: 18px; font-weight: 800;">Add task</div>
        <div style="font-size: 13px; font-weight: 600; color: #DDE7FC; margin-top: 4px;">or dump a note</div>
      </div>
    </section>
  </div>

  <div style="flex-grow: 1;"></div>
  <div aria-hidden="true" style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px;">
    <div class="app"><span class="i"></span>Phone</div>
    <div class="app"><span class="i"></span>Messages</div>
    <div class="app"><span class="i" style="background: #2F6BE3;"></span>Loop</div>
    <div class="app"><span class="i"></span>Camera</div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const busy = [2, 6, 9, 12, 13, 14, 15, 19, 20, 22, 27, 30];
    const cells = [];
    [27, 28, 29, 30].forEach((d) => cells.push({ d, cls: 'mc mut' }));
    for (let d = 1; d <= 31; d++) cells.push({ d, cls: d === 16 ? 'mc sel' : (busy.includes(d) ? 'mc has' : 'mc') });
    return { cells };
  }
}
</script>
</body>
</html>
