<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Date and reminder</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap">
<style>
:where(a.lk){display:inline-flex;align-items:center;justify-content:center;text-align:center;color:inherit;text-decoration:none;cursor:pointer}:where(a.lkb){display:block;color:inherit;text-decoration:none;cursor:pointer}a.lk.row,a.lk.item,a.lk.r,a.lk.b,a.lk.set,a.lk.note{justify-content:flex-start;text-align:left}a.lk.b{align-items:flex-start}
body{margin:0} *{box-sizing:border-box} button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
.ic{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.c{min-height:38px;padding:0 14px;border-radius:12px;background:#F2F4F9;font-size:14px;font-weight:700;color:#636B80;white-space:nowrap}
.c.on{background:#2F6BE3;color:#FFFFFF}
.wd{font-size:12px;color:#636B80;text-align:center;font-weight:600;padding-bottom:6px}
.cell{height:40px;display:flex;align-items:center;justify-content:center;font-size:14.5px;font-weight:600;font-variant-numeric:tabular-nums}
.cell span{width:34px;height:34px;border-radius:11px;display:flex;align-items:center;justify-content:center}
.cell.mut{color:#C9D2E3}
.cell.today span{color:#2F6BE3;font-weight:800}
.cell.sel span{background:#2F6BE3;color:#FFFFFF}
.row{display:flex;align-items:center;gap:14px;width:100%;min-height:54px;font-size:15.5px;font-weight:600;text-align:left;border-top:1px solid #F2F4F9}
.row .v{margin-left:auto;font-size:15px;font-weight:700;color:#2F6BE3}

@keyframes lpSheet{from{transform:translateY(100%)}to{transform:none}}@keyframes lpDim{from{background-color:#F2F4F9}}@keyframes lpPop{0%{opacity:0;transform:scale(.92)}60%{opacity:1;transform:scale(1.02)}100%{transform:none}}@keyframes lpUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}@keyframes lpDrop{from{opacity:0;transform:translateY(-28px) scale(.98)}to{opacity:1;transform:none}}@keyframes lpLeft{from{transform:translateX(-100%)}to{transform:none}}@keyframes lpFade{from{opacity:0}to{opacity:1}}@keyframes lpTick{0%{transform:scale(.4)}55%{transform:scale(1.18)}100%{transform:none}}@keyframes lpGrow{from{width:20%}}@keyframes lpPulse{0%,100%{box-shadow:0 0 0 0 rgba(199,55,47,.45)}50%{box-shadow:0 0 0 6px rgba(199,55,47,0)}}section[style*="border-radius: 28px 28px 0 0"]{animation:lpSheet .42s cubic-bezier(.2,.9,.25,1) both}div[style*="background: #8E95A6"]{animation:lpDim .3s ease-out both}section[role="alertdialog"]{animation:lpPop .32s cubic-bezier(.2,.9,.25,1) .05s both}nav[aria-label="Main menu"]{animation:lpLeft .38s cubic-bezier(.2,.9,.25,1) both}article[aria-label="Loop notification"]{animation:lpDrop .5s cubic-bezier(.2,.9,.25,1) .15s both}[role="status"]{animation:lpUp .36s cubic-bezier(.2,.9,.25,1) .25s both}h1{animation:lpUp .4s cubic-bezier(.2,.9,.25,1) both}.grp,.note,.ag,.empty{animation:lpUp .45s cubic-bezier(.2,.9,.25,1) .06s both}.grp+.grp,.lab+.grp{animation-delay:.1s}div[aria-hidden="true"][style*="border-radius: 50%; background: #2F6BE3"]{animation:lpTick .5s cubic-bezier(.2,.9,.25,1) .1s both}.chk.on i{animation:lpTick .4s cubic-bezier(.2,.9,.25,1) both}[role="progressbar"]>div{animation:lpGrow .6s cubic-bezier(.2,.9,.25,1) .1s both}[aria-label="Add task"],[aria-label="New note"]{animation:lpPop .4s cubic-bezier(.2,.9,.25,1) .18s both}[aria-label^="Now,"] span{animation:lpPulse 2s ease-in-out infinite}a.lk,a.lkb,button{transition:transform .14s ease,filter .14s ease,background-color .2s ease}a.lk:active,button:active{transform:scale(.96)}a.lkb:active{transform:scale(.985)}a.lk:hover,button:hover{filter:brightness(.97)}@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</helmet>
<div style="width: 390px; height: 844px; background: #8E95A6; color: #141A2E; font-family: 'Plus Jakarta Sans', ui-sans-serif, system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden;">
  <a class="lkb" href="VTaskDetail.dc.html" aria-label="Close" style="flex-grow: 1;"></a>
  <section aria-label="Date and reminder" style="background: #FFFFFF; border-radius: 28px 28px 0 0; padding: 12px 24px 24px; display: flex; flex-direction: column; gap: 14px;">
    <div aria-hidden="true" style="align-self: center; width: 40px; height: 5px; border-radius: 3px; background: #C9D2E3;"></div>
    <div style="display: flex; gap: 8px; overflow: hidden;">
      <button class="c">Today</button><button class="c">Tomorrow</button><button class="c on">Tue, Oct 20</button><button class="c">No date</button>
    </div>
    <div style="display: flex; align-items: center; justify-content: space-between;">
      <span style="font-size: 17px; font-weight: 800;">October 2026</span>
      <span style="display: flex; gap: 4px;">
        <button aria-label="Previous month" style="width: 40px; height: 40px; border-radius: 12px; background: #F2F4F9; display: flex; align-items: center; justify-content: center;"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg></button>
        <button aria-label="Next month" style="width: 40px; height: 40px; border-radius: 12px; background: #F2F4F9; display: flex; align-items: center; justify-content: center;"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg></button>
      </span>
    </div>
    <div>
      <div style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr));"><div class="wd">S</div><div class="wd">M</div><div class="wd">T</div><div class="wd">W</div><div class="wd">T</div><div class="wd">F</div><div class="wd">S</div></div>
      <div style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr));">
        <sc-for list="{{cells}}" as="c" hint-placeholder-count="35"><div class="{{c.cls}}"><span>{{c.d}}</span></div></sc-for>
      </div>
    </div>
    <div style="display: flex; flex-direction: column;">
      <button class="row"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true" style="color: #636B80;"><circle cx="12" cy="12" r="8"></circle><path d="M12 8v4l3 2"></path></svg>Time<span class="v">10:00 – 11:00</span></button>
      <button class="row"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true" style="color: #636B80;"><path d="M6 16V11a6 6 0 0 1 12 0v5l1.5 2h-15z"></path><path d="M10 20a2 2 0 0 0 4 0"></path></svg>Reminder<span class="v">15 min before</span></button>
      <a href="NRepeat.dc.html" class="lk row"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true" style="color: #636B80;"><path d="M17 3l3 3-3 3M4 11V9a3 3 0 0 1 3-3h13M7 21l-3-3 3-3M20 13v2a3 3 0 0 1-3 3H4"></path></svg>Repeat<span class="v" style="color: #636B80;">Never</span></a>
    </div>
    <a href="VTaskDetail.dc.html" class="lk" style="min-height: 56px; border-radius: 18px; background: #2F6BE3; color: #FFFFFF; font-size: 16px; font-weight: 800;">Done</a>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const cells = [];
    [27, 28, 29, 30].forEach((d) => cells.push({ d, cls: 'cell mut' }));
    for (let d = 1; d <= 31; d++) cells.push({ d, cls: d === 20 ? 'cell sel' : (d === 16 ? 'cell today' : 'cell') });
    return { cells };
  }
}
</script>
</body>
</html>
