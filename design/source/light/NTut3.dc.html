<style>
:where(a.lk){display:inline-flex;align-items:center;justify-content:center;text-align:center;color:inherit;text-decoration:none;cursor:pointer}:where(a.lkb){display:block;color:inherit;text-decoration:none;cursor:pointer}a.lk.row,a.lk.item,a.lk.r,a.lk.b,a.lk.set,a.lk.note{justify-content:flex-start;text-align:left}a.lk.b{align-items:flex-start}

.dot{width:8px;height:8px;border-radius:4px;background:#C9D2E3}
.dot.on{width:24px;background:#2F6BE3}
.dot.done{background:#2F6BE3}

@keyframes lpSheet{from{transform:translateY(100%)}to{transform:none}}@keyframes lpDim{from{background-color:#F2F4F9}}@keyframes lpPop{0%{opacity:0;transform:scale(.92)}60%{opacity:1;transform:scale(1.02)}100%{transform:none}}@keyframes lpUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}@keyframes lpDrop{from{opacity:0;transform:translateY(-28px) scale(.98)}to{opacity:1;transform:none}}@keyframes lpLeft{from{transform:translateX(-100%)}to{transform:none}}@keyframes lpFade{from{opacity:0}to{opacity:1}}@keyframes lpTick{0%{transform:scale(.4)}55%{transform:scale(1.18)}100%{transform:none}}@keyframes lpGrow{from{width:20%}}@keyframes lpPulse{0%,100%{box-shadow:0 0 0 0 rgba(199,55,47,.45)}50%{box-shadow:0 0 0 6px rgba(199,55,47,0)}}section[style*="border-radius: 28px 28px 0 0"]{animation:lpSheet .42s cubic-bezier(.2,.9,.25,1) both}div[style*="background: #8E95A6"]{animation:lpDim .3s ease-out both}section[role="alertdialog"]{animation:lpPop .32s cubic-bezier(.2,.9,.25,1) .05s both}nav[aria-label="Main menu"]{animation:lpLeft .38s cubic-bezier(.2,.9,.25,1) both}article[aria-label="Loop notification"]{animation:lpDrop .5s cubic-bezier(.2,.9,.25,1) .15s both}[role="status"]{animation:lpUp .36s cubic-bezier(.2,.9,.25,1) .25s both}h1{animation:lpUp .4s cubic-bezier(.2,.9,.25,1) both}.grp,.note,.ag,.empty{animation:lpUp .45s cubic-bezier(.2,.9,.25,1) .06s both}.grp+.grp,.lab+.grp{animation-delay:.1s}div[aria-hidden="true"][style*="border-radius: 50%; background: #2F6BE3"]{animation:lpTick .5s cubic-bezier(.2,.9,.25,1) .1s both}.chk.on i{animation:lpTick .4s cubic-bezier(.2,.9,.25,1) both}[role="progressbar"]>div{animation:lpGrow .6s cubic-bezier(.2,.9,.25,1) .1s both}[aria-label="Add task"],[aria-label="New note"]{animation:lpPop .4s cubic-bezier(.2,.9,.25,1) .18s both}[aria-label^="Now,"] span{animation:lpPulse 2s ease-in-out infinite}a.lk,a.lkb,button{transition:transform .14s ease,filter .14s ease,background-color .2s ease}a.lk:active,button:active{transform:scale(.96)}a.lkb:active{transform:scale(.985)}a.lk:hover,button:hover{filter:brightness(.97)}@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>

<div style="width: 390px; height: 844px; background: #F2F4F9; color: #141A2E; font-family: 'Plus Jakarta Sans', ui-sans-serif, system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden;">
  <div style="display: flex; align-items: center; gap: 6px; padding: 22px 24px 0;">

    <span style="font-size: 13px; font-weight: 700; color: #636B80; margin-left: 8px; flex-grow: 1;">3 of 3</span>
    <a href="NTutDone.dc.html" class="lk" style="min-height: 40px; font-size: 14px; font-weight: 700; color: #636B80;">Skip</a>

  </header>

  <label for="tut-dump" style="margin: 24px 24px 0; display: flex; align-items: center; gap: 12px; min-height: 60px; padding: 0 18px; background: #FFFFFF; border-radius: 18px; outline: 3px solid #DCE6FB;">

    <input id="tut-dump" value="Ideas for the weekend" style="border: 0; background: none; outline: none; flex-grow: 1; font-size: 16px; font-weight: 600; min-width: 0;">
  </label>

  <div style="padding: 12px 24px 0;">
    <div style="max-width: 300px; background: #141A2E; color: #FFFFFF; border-radius: 18px; padding: 14px 16px; font-size: 14.5px; line-height: 1.45;">
      Not sure when? Dump it here. Loop helps you sort it into a task or a note later.
    </div>
  </div>

  <div style="flex-grow: 1;"></div>

  <div style="padding: 0 24px 32px; display: flex; flex-direction: column; gap: 10px;">
    <a href="NTutDone.dc.html" class="lk" style="min-height: 58px; border-radius: 18px; background: #2F6BE3; color: #FFFFFF; font-size: 16px; font-weight: 800;">Save and finish</a>
