<!doctype html>
<html lang="en">
<head>

<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap">
<style>
:where(a.lk){display:inline-flex;align-items:center;justify-content:center;text-align:center;color:inherit;text-decoration:none;cursor:pointer}:where(a.lkb){display:block;color:inherit;text-decoration:none;cursor:pointer}a.lk.row,a.lk.item,a.lk.r,a.lk.b,a.lk.set,a.lk.note{justify-content:flex-start;text-align:left}a.lk.b{align-items:flex-start}
body{margin:0;color-scheme:dark} *{box-sizing:border-box} button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
.dot{width:8px;height:8px;border-radius:4px;background:#3A4357}
.dot.on{width:24px;background:#2F6BE3}
.dot.done{background:#2F6BE3}

@keyframes lpSheet{from{transform:translateY(100%)}to{transform:none}}@keyframes lpDim{from{background-color:#0F1320}}@keyframes lpPop{0%{opacity:0;transform:scale(.92)}60%{opacity:1;transform:scale(1.02)}100%{transform:none}}@keyframes lpUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}@keyframes lpDrop{from{opacity:0;transform:translateY(-28px) scale(.98)}to{opacity:1;transform:none}}@keyframes lpLeft{from{transform:translateX(-100%)}to{transform:none}}@keyframes lpFade{from{opacity:0}to{opacity:1}}@keyframes lpTick{0%{transform:scale(.4)}55%{transform:scale(1.18)}100%{transform:none}}@keyframes lpGrow{from{width:20%}}@keyframes lpPulse{0%,100%{box-shadow:0 0 0 0 rgba(199,55,47,.45)}50%{box-shadow:0 0 0 6px rgba(199,55,47,0)}}section[style*="border-radius: 28px 28px 0 0"]{animation:lpSheet .42s cubic-bezier(.2,.9,.25,1) both}div[style*="background: #05070D"]{animation:lpDim .3s ease-out both}section[role="alertdialog"]{animation:lpPop .32s cubic-bezier(.2,.9,.25,1) .05s both}nav[aria-label="Main menu"]{animation:lpLeft .38s cubic-bezier(.2,.9,.25,1) both}article[aria-label="Loop notification"]{animation:lpDrop .5s cubic-bezier(.2,.9,.25,1) .15s both}[role="status"]{animation:lpUp .36s cubic-bezier(.2,.9,.25,1) .25s both}h1{animation:lpUp .4s cubic-bezier(.2,.9,.25,1) both}.grp,.note,.ag,.empty{animation:lpUp .45s cubic-bezier(.2,.9,.25,1) .06s both}.grp+.grp,.lab+.grp{animation-delay:.1s}div[aria-hidden="true"][style*="border-radius: 50%; background: #2F6BE3"]{animation:lpTick .5s cubic-bezier(.2,.9,.25,1) .1s both}.chk.on i{animation:lpTick .4s cubic-bezier(.2,.9,.25,1) both}[role="progressbar"]>div{animation:lpGrow .6s cubic-bezier(.2,.9,.25,1) .1s both}[aria-label="Add task"],[aria-label="New note"]{animation:lpPop .4s cubic-bezier(.2,.9,.25,1) .18s both}[aria-label^="Now,"] span{animation:lpPulse 2s ease-in-out infinite}a.lk,a.lkb,button{transition:transform .14s ease,filter .14s ease,background-color .2s ease}a.lk:active,button:active{transform:scale(.96)}a.lkb:active{transform:scale(.985)}a.lk:hover,button:hover{filter:brightness(1.12)}@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</helmet>
<div style="width: 390px; height: 844px; background: #0F1320; color: #E8ECF5; font-family: 'Plus Jakarta Sans', ui-sans-serif, system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden;">
  <div style="display: flex; align-items: center; gap: 6px; padding: 22px 24px 0;">
    <span class="dot done"></span><span class="dot on"></span><span class="dot"></span>
    <span style="font-size: 13px; font-weight: 700; color: #9AA3B8; margin-left: 8px; flex-grow: 1;">2 of 3</span>
    <a href="DNTutDone.dc.html" class="lk" style="min-height: 40px; font-size: 14px; font-weight: 700; color: #9AA3B8;">Skip</a>
  </div>
  <header style="padding: 8px 24px 0;">
    <div style="font-size: 15px; color: #9AA3B8;">Friday, October 16</div>
    <h1 style="margin: 4px 0 0; font-size: 36px; line-height: 1.1; font-weight: 800; letter-spacing: -0.02em;">Today</h1>
  </header>

  <div style="padding: 28px 24px 12px; font-size: 14px; font-weight: 700; color: #9AA3B8;">Schedule</div>
  <div style="margin: 0 24px; background: #2F6BE3; color: #FFFFFF; border-radius: 20px; padding: 16px 12px 16px 20px; display: flex; align-items: center; gap: 12px;">
    <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 6px;">
      <span style="font-size: 16px; font-weight: 700;">Plan my week</span>
      <span style="font-size: 14px; color: #DDE7FC;">18:00 · Inbox</span>
    </div>
    <a href="DNTut3.dc.html" class="lk" aria-label="Mark done" style="width: 56px; height: 56px; display: flex; align-items: center; justify-content: center; border-radius: 50%; background: rgba(255,255,255,0.18);">
      <span style="width: 30px; height: 30px; border-radius: 50%; border: 2.5px solid #FFFFFF;"></span>
    </a>
  </div>

  <div style="display: flex; justify-content: flex-end; padding: 10px 24px 0;">
    <div style="max-width: 280px; background: #2C3550; color: #FFFFFF; border-radius: 18px; padding: 14px 16px; font-size: 14.5px; line-height: 1.45;">
      Nice, it's on your day. Tap the circle when it's done. Don't worry, you can undo.
    </div>
  </div>

  <div style="flex-grow: 1;"></div>
  <div style="margin: 0 24px 32px; border-radius: 20px; background: #1A2030; padding: 18px 20px; font-size: 14.5px; line-height: 1.5; color: #9AA3B8;">
    Tasks you don't finish never disappear. Next morning, Loop asks what to do with them.
  </div>
</div>
